# 依存更新 PR に検証シグナルを付けるための最小 CI。
# CI が無いリポジトリでは、依存更新の PR が「壊れていないこと」を誰も保証できない。
name: verify

on:
  pull_request:
  push:
    # development への push でも回すこと。昇格（development → main）の判定は
    # 「development の CI が緑か」で行うため、ここに development が無いと
    # 実行履歴が生まれず、永久に昇格できなくなる。
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
