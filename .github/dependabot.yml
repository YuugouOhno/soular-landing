# Dependabot: 脆弱性アラート + 週次の依存更新 PR。
# dev-dep-audit スキルと役割が違う:
#   Dependabot = 機械的に検知して PR を投げる常時稼働の網
#   dev-dep-audit = まとめて判断・検証して 1 本の PR にする棚卸し
# 併用してよい（重複した PR は棚卸し側でクローズする）。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # 依存更新は development で検証してから main へ昇格させる。既定（main 宛て）だと
    # main が先に進み、昇格 PR が「差がある」で止まる。
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      # 時刻を書かないと GitHub が勝手に決める。dep-audit（毎日 1:30 JST）の
      # 直前に置く。夜のうちに捌き、朝は昇格 PR をマージするかの判断だけ残す。
      time: "01:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # 個別 PR が乱立しないよう、非破壊的な更新はまとめる
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # 依存更新は development で検証してから main へ昇格させる。既定（main 宛て）だと
    # main が先に進み、昇格 PR が「差がある」で止まる。
    target-branch: "development"
    schedule:
      interval: "monthly"
      day: "monday"
      # 時刻を書かないと GitHub が勝手に決める。dep-audit（毎日 1:30 JST）の
      # 直前に置く。夜のうちに捌き、朝は昇格 PR をマージするかの判断だけ残す。
      time: "01:00"
      timezone: "Asia/Tokyo"
    labels: ["dependencies"]
